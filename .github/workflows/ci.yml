name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

  publish:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@11 --force

      - name: Publish packages
        shell: bash +e {0}
        run: |
          FAILED=""
          for pkg in packages/*/; do
            PKG_NAME=$(node -p "require('./$pkg/package.json').name")
            PKG_VERSION=$(node -p "require('./$pkg/package.json').version")
            if npm view "$PKG_NAME@$PKG_VERSION" version 2>/dev/null; then
              echo "::notice::$PKG_NAME@$PKG_VERSION already published, skipping."
              continue
            fi
            echo "Publishing $PKG_NAME@$PKG_VERSION..."
            (
              cd "$pkg"
              TARBALL=$(pnpm pack --pack-destination /tmp | tail -1)
              npm publish "$TARBALL" --access public --provenance
            )
            if [ $? -ne 0 ]; then
              echo "::error::Failed to publish $PKG_NAME@$PKG_VERSION"
              FAILED="$FAILED $PKG_NAME@$PKG_VERSION"
            fi
          done
          if [ -n "$FAILED" ]; then
            echo "::error::The following packages failed to publish:$FAILED"
            exit 1
          fi
          echo "All publishable packages processed successfully."
