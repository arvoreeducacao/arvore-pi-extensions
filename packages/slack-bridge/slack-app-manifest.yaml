display_information:
  name: Pi Bridge
  description: Ponte bidirecional entre uma sessão Pi e o Slack (uma thread = uma sessão).
  background_color: "#1f2d3d"

features:
  bot_user:
    display_name: Pi Bridge
    always_online: true
  assistant_view:
    assistant_description: Controle sua sessão Pi pelo Slack.
    suggested_prompts: []
  app_home:
    home_tab_enabled: false
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false

oauth_config:
  scopes:
    bot:
      - chat:write
      - assistant:write
      - im:history
      - im:read
      - im:write
      - channels:history
      - groups:history

settings:
  event_subscriptions:
    bot_events:
      - assistant_thread_started
      - message.im
      - message.channels
      - message.groups
  interactivity:
    is_enabled: false
  socket_mode_enabled: true
  org_deploy_enabled: false
  token_rotation_enabled: false
